<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoply | Online Store</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <h1 class="logo">Shoply<span>.</span></h1>

            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#products">Products</a></li>
            </ul>

            <button class="cart-button" onclick="toggleCart()">
                🛒 Cart (<span id="cart-count">0</span>)
            </button>
        </nav>
    </header>

    <main>
        <section class="hero" id="home">
            <div>
                <h2>Find Your Perfect Style.</h2>
                <p>Discover amazing products at amazing prices.</p>
                <a href="#products" class="shop-button">Shop Now</a>
            </div>
        </section>

        <section class="products-section" id="products">
            <h2>Our Products</h2>
            <p class="section-description">Check out our latest collection.</p>

            <div class="products-grid" id="products-container">
                <!-- Products are generated by JavaScript -->
            </div>
        </section>
    </main>

    <aside class="cart-panel" id="cart-panel">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button onclick="toggleCart()">✕</button>
        </div>

        <div id="cart-items"></div>

        <div class="cart-footer">
            <h3>Total: $<span id="cart-total">0.00</span></h3>
            <button class="checkout-button" onclick="checkout()">
                Checkout
            </button>
        </div>
    </aside>

    <footer>
        <p>© 2026 Shoply. Built for Git & GitHub practice.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
